{% extends "portfolio/base.html" %}

{% block content %}

<h1>Editar Contrato</h1>

{% if erro %}
<p style="color:red">{{ erro }}</p>
{% endif %}

<form method="post">
    {% csrf_token %}

    <label>Título</label><br>
    <input type="text"
           name="titulo"
           value="{{ contrato.titulo }}"><br><br>

    <label>Tipo</label><br>
    <input type="text"
           name="tipo"
           value="{{ contrato.tipo }}"><br><br>

    <label>Jurisdição</label><br>
    <input type="text"
           name="jurisdicao"
           value="{{ contrato.jurisdicao }}"><br><br>

    <label>Texto Original</label><br>
    <textarea name="texto_original"
              rows="10"
              cols="80">{{ contrato.texto_anonimizado }}</textarea><br><br>

    <button type="submit">
        Guardar Alterações
    </button>
    </form>

</form>

<br>

<a href="{% url 'tarefas_colega' %}">
    ← Voltar
</a>

{% endblock %}
