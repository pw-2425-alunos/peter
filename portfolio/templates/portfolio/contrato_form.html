{% extends "portfolio/base.html" %}

{% block title %}
Criar Contrato
{% endblock %}

{% block content %}

<h1>Criar Contrato</h1>

{% if erro %}

<p style="color:red;">
    {{ erro }}
</p>

{% endif %}

<form method="post">

    {% csrf_token %}

    <p>
        <label>Título</label><br>
        <input
            type="text"
            name="titulo"
            required>
    </p>

    <p>
        <label>Tipo</label><br>
        <input
            type="text"
            name="tipo"
            required>
    </p>

    <p>
        <label>Jurisdição</label><br>
        <input
            type="text"
            name="jurisdicao"
            value="PT"
            required>
    </p>

    <p>
        <label>Texto Original</label><br>

        <textarea
            name="texto_original"
            rows="10"
            cols="80"
            required></textarea>

    </p>

    <button type="submit">
        Criar Contrato
    </button>

</form>

<br>

<a href="{% url 'tarefas_colega' %}">
    ← Voltar
</a>

{% endblock %}
