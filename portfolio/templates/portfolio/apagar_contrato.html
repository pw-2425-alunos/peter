{% extends 'portfolio/base.html' %}

{% block content %}

<h1>Apagar Contrato</h1>

<p>
Tem a certeza que pretende apagar o contrato {{ id }}?
</p>

{% if erro %}
<p style="color:red;">
    {{ erro }}
</p>
{% endif %}

<form method="post">
    {% csrf_token %}

    <button type="submit">
        Sim, apagar
    </button>
</form>

<br>

<a href="{% url 'tarefas_colega' %}">
    Cancelar
</a>

{% endblock %}
